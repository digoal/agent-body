  <text x="210" y="390" font-size="11" font-weight="600" fill="#162A33" text-anchor="start">COMP-C2 vs OpenViking: Q 45.5 -&gt; 100.0 (省 99.4%)</text>
  <text x="210" y="414" font-size="11" font-weight="600" fill="#162A33" text-anchor="start">W1/W7 能力&amp;路由: Q -&gt; 100.0 (省 99.4% ~ 99.9%)</text>
  <rect x="688" y="96" width="404" height="232" rx="7" fill="#FFFFFF" stroke="#1D5B70" stroke-width="1.6"/>
  <rect x="688" y="96" width="404" height="30" rx="7" fill="#E7F2F5" stroke="#1D5B70" stroke-width="1.2"/>
  <text x="702" y="116" font-size="14" font-weight="700" fill="#134252" text-anchor="start">四维确定性上下文质量函数 Q in [0, 100]</text>
  <text x="702" y="144" font-size="12" font-weight="400" fill="#162A33" text-anchor="start">Q = 100 * (0.40*R_fact + 0.30*P_signal</text>
  <text x="702" y="166" font-size="12" font-weight="400" fill="#162A33" text-anchor="start">         + 0.20*A_action + 0.10*S_safety)</text>
  <text x="702" y="188" font-size="12" font-weight="400" fill="#162A33" text-anchor="start">1. R_fact (40%): 必含物理真值事实召回完整率</text>
  <text x="702" y="210" font-size="12" font-weight="400" fill="#162A33" text-anchor="start">2. P_signal (30%): 有效信号字节信噪纯净度</text>
  <text x="702" y="232" font-size="12" font-weight="400" fill="#162A33" text-anchor="start">3. A_action (20%): 可直接执行的路径/端口/补丁</text>
  <text x="702" y="254" font-size="12" font-weight="400" fill="#162A33" text-anchor="start">4. S_safety (10%): 零密钥残留与抗注入合规度</text>
  <text x="702" y="276" font-size="12" font-weight="400" fill="#162A33" text-anchor="start">信息密度增益: rho_gain = rho_body / rho_base</text>
  <rect x="688" y="348" width="404" height="232" rx="7" fill="#FFFFFF" stroke="#B56917" stroke-width="1.6"/>
  <rect x="688" y="348" width="404" height="30" rx="7" fill="#FDF2E0" stroke="#B56917" stroke-width="1.2"/>
  <text x="702" y="368" font-size="14" font-weight="700" fill="#8A4E0D" text-anchor="start">生产效能存证账本 (EffectivenessLedger)</text>
  <text x="702" y="396" font-size="12" font-weight="400" fill="#162A33" text-anchor="start">杜绝拍脑袋估算: 每次收益强制绑定 PR-01 ~ PR-16</text>
  <text x="702" y="420" font-size="12" font-weight="400" fill="#162A33" text-anchor="start">- PR-01~08: 技能路由/分层扫描/Pre-Hook/简报</text>
  <text x="702" y="444" font-size="12" font-weight="400" fill="#162A33" text-anchor="start">- PR-11~13: AOPCC 租约直通/审计演化/跨脑胶囊</text>
  <text x="702" y="468" font-size="12" font-weight="400" fill="#162A33" text-anchor="start">- PR-15~16: 睡眠整理省 Token / 快权重门禁验证</text>
  <text x="702" y="492" font-size="12" font-weight="400" fill="#162A33" text-anchor="start">开销与防伪: 异步记账 &lt;100 us；批次报告携带</text>
  <text x="702" y="516" font-size="12" font-weight="400" fill="#162A33" text-anchor="start">宿主机硬件指纹、Git Hash 与 SHA-256 签名</text>
  <text x="28" y="612" font-size="11" font-weight="400" fill="#6B7F88" text-anchor="start">数据出处: 本机真机实跑 run-310cf715 (W1~W19, COMP-C1~C4) 及 Phase 76~78 (W20~W22) · src/benchmark/</text>
