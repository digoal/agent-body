  <text x="578" y="338" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">命题: 微内核防腐与零重扫自进化</text>
  <text x="578" y="362" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">矛盾: 递弱代偿膨胀 + 毛细血管漂移</text>
  <text x="578" y="386" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">机制 1: 类 PG 8 张 body_cat_* 目录</text>
  <text x="578" y="410" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">机制 2: 11 个标准五件套 contrib</text>
  <text x="578" y="434" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">机制 3: 16 类一等公民 O(1) 路由</text>
  <text x="578" y="458" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">机制 4: 运行时-工程态双飞轮闭环</text>
  <text x="578" y="482" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">裁剪力: 3.9MB 纯内核 / 0 C++ 探针</text>
  <text x="578" y="506" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">工程度: 78 阶段 435 测 0 Panic</text>
