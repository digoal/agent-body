[package]
name = "ext-idx-fts-fuzzy"
version = "0.1.0"
edition = "2021"
authors = ["digoal 德哥"]
description = "Agent Body Contrib Extension — Pure-Rust FTS + CamelCase/SnakeCase + Bigram Jaccard + Bounded Levenshtein IndexAM"
