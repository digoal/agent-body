  <text x="846" y="362" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">矛盾: 密钥外泄/黑盒自治/丢事实刷分</text>
  <text x="846" y="386" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">机制 1: L1~L5 脱敏与抗提示词投毒</text>
  <text x="846" y="410" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">机制 2: IN/OUT 双域 60s 折叠审计</text>
  <text x="846" y="434" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">机制 3: MeshEnvelope v1.0 零信任</text>
  <text x="846" y="458" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">机制 4: 四维质量 Q 帕累托双门禁</text>
  <text x="846" y="482" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">现网审计: 7d 9,431 条 0% 明文泄露</text>
  <text x="846" y="506" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">可溯账本: PR-01~16 SHA-256 存证</text>
