  <text x="210" y="270" font-size="11" font-weight="600" fill="#162A33" text-anchor="start">W8 冷启动简报: Q 40.0 -&gt; 96.6 (省 59.0%)</text>
  <text x="210" y="294" font-size="11" font-weight="600" fill="#162A33" text-anchor="start">COMP-C4 vs CLI: Q 37.3 -&gt; 97.5 (省 46.0%, 0子进程)</text>
  <text x="210" y="318" font-size="11" font-weight="600" fill="#162A33" text-anchor="start">W15 AOPCC 回路: Q 52.0 -&gt; 100.0 (省 83.9%, 3.49x)</text>
