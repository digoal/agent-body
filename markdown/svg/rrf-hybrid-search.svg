<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="220" rx="8" fill="url(#bgGrad5)" stroke="#1e293b"/>
  <text x="400" y="30" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">🔍 双路混合检索与 RRF 倒数排名融合机制 (Hybrid Search)</text>

  <!-- Query input -->
  <rect x="25" y="80" width="130" height="55" rx="6" fill="#0f2647" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="90" y="102" fill="#e0f2fe" font-size="9" font-weight="bold" text-anchor="middle">口语化 Query</text>
  <text x="90" y="120" fill="#38bdf8" font-size="9" font-weight="bold" text-anchor="middle">“防雪崩预案”</text>

  <path d="M 155 95 L 205 65" stroke="#f43f5e" stroke-width="1.8"/>
  <path d="M 155 120 L 205 150" stroke="#818cf8" stroke-width="1.8"/>

  <!-- Channel A -->
  <rect x="205" y="45" width="220" height="42" rx="4" fill="#2d0b16" stroke="#f43f5e"/>
  <text x="315" y="62" fill="#fecaca" font-size="8.5" font-weight="bold" text-anchor="middle">渠道 A: SQLite FTS5 全文关键词</text>
  <text x="315" y="77" fill="#fca5a5" font-size="7.5" text-anchor="middle">字面不匹配 ➔ 0 条命中 (失忆漏召)</text>

  <!-- Channel B -->
  <rect x="205" y="130" width="220" height="42" rx="4" fill="#1e1b4b" stroke="#818cf8"/>
  <text x="315" y="147" fill="#e0e7ff" font-size="8.5" font-weight="bold" text-anchor="middle">渠道 B: Ollama bge-m3 1024 维向量</text>
  <text x="315" y="162" fill="#c7d2fe" font-size="7.5" text-anchor="middle">余弦相似度 0.892 ➔ 命中概念</text>

  <!-- Merge to RRF -->
  <path d="M 425 65 L 475 95" stroke="#10b981" stroke-width="2"/>
  <path d="M 425 150 L 475 120" stroke="#10b981" stroke-width="2"/>

  <rect x="475" y="65" width="160" height="85" rx="6" fill="#062e24" stroke="#10b981" stroke-width="1.5"/>
  <text x="555" y="88" fill="#d1fae5" font-size="9" font-weight="bold" text-anchor="middle">RRF 倒数排名融合</text>
  <text x="555" y="105" fill="#34d399" font-size="8" font-weight="bold" text-anchor="middle">Score = 1/(60+r₁) + 1/(60+r₂)</text>
  <text x="555" y="125" fill="#a7f3d0" font-size="7.5" text-anchor="middle">平衡术语精准与语义泛化</text>
  <text x="555" y="139" fill="#94a3b8" font-size="7" text-anchor="middle">模型离线时平滑退化为 FTS</text>

  <path d="M 635 107 L 670 107" stroke="#10b981" stroke-width="2"/>

  <!-- Output -->
  <rect x="670" y="65" width="115" height="85" rx="6" fill="#04231b" stroke="#059669"/>
  <text x="727" y="90" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">🎯 召回 #1</text>
  <text x="727" y="108" fill="#34d399" font-size="8" font-weight="bold" text-anchor="middle">PostgreSQL</text>
  <text x="727" y="122" fill="#a7f3d0" font-size="7.5" text-anchor="middle">熔断降级方案</text>
  <text x="727" y="138" fill="#6ee7b7" font-size="7" text-anchor="middle">无缝继承经验！</text>

  <rect x="25" y="180" width="760" height="28" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="405" y="198" fill="#cbd5e1" font-size="8" text-anchor="middle">💡 告别大模型跨会话失忆与低水平重复造轮子：概念级联想唤醒组织已有高质量沉淀。</text>
</svg>
