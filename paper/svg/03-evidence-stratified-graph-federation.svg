  <text x="42" y="47" font-size="18" font-weight="700" fill="#162A33" text-anchor="start">Paper 03 图 1 · L1/L2/L3 证据分层有向加权图谱与 CodeGraph 宏微代码联邦</text>
  <text x="42" y="68" font-size="12" font-weight="400" fill="#425863" text-anchor="start">严禁将隐式向量近邻伪装成物理硬依赖：分层赋权 + 跳数阻尼衰减 (gamma=0.80) + 宏观文件/服务拓扑穿透微观 AST 符号图</text>
  <rect x="28" y="98" width="610" height="142" rx="7" fill="#FFFFFF" stroke="#B43C2C" stroke-width="1.6"/>
  <rect x="28" y="98" width="610" height="30" rx="7" fill="#FCEBE8" stroke="#B43C2C" stroke-width="1.2"/>
  <text x="42" y="118" font-size="13" font-weight="700" fill="#89281B" text-anchor="start">Tier L1 · L1_EXPLICIT 物理显式硬依赖层 (w in [0.85, 1.00])</text>
  <text x="42" y="146" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">证据源: Systemd ExecStart · Cron 目标脚本 · /proc Socket · AST import</text>
  <text x="42" y="168" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">工程语义: 确定性物理硬边 (listens_on / scheduled_by)，改动直接触发故障</text>
  <text x="42" y="190" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">治理保证: 爆炸半径默认强纳入；FreshnessReconciler 实时剪枝失效节点</text>
  <rect x="28" y="258" width="610" height="148" rx="7" fill="#FFFFFF" stroke="#1D5B70" stroke-width="1.6"/>
  <rect x="28" y="258" width="610" height="30" rx="7" fill="#E7F2F5" stroke="#1D5B70" stroke-width="1.2"/>
  <text x="42" y="278" font-size="13" font-weight="700" fill="#134252" text-anchor="start">Tier L2 · L2_STRUCTURAL &amp; KNOWHOW 结构与因果层 (0.55~0.88)</text>
  <text x="42" y="306" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">结构上卷: 5,116 条文件引用对数饱和上卷 w_L2 = min(0.84, 0.55+0.08*ln(1+N))</text>
  <text x="42" y="328" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">同体桥接: runs_as 消解 Systemd 与 /proc 分裂；PMI&gt;1.2 术语共现 (Top-5)</text>
  <text x="42" y="350" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">锚定经验: 0.8B 小模型抽取 causes/mitigates 三元组 (&gt;=8 字符原文核验)</text>
  <rect x="28" y="424" width="610" height="142" rx="7" fill="#FFFFFF" stroke="#5A418E" stroke-width="1.6"/>
  <rect x="28" y="424" width="610" height="30" rx="7" fill="#EFEBF8" stroke="#5A418E" stroke-width="1.2"/>
  <text x="42" y="444" font-size="13" font-weight="700" fill="#3F2B69" text-anchor="start">Tier L3 · L3_SEMANTIC 稀疏语义亲和层 (0.35~0.65, Top-K&lt;=3)</text>
  <text x="42" y="472" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">混合打分: S = 0.75*cos(u,v) + 0.25*J(T_u,T_v) (门槛 cos&gt;=0.78, S&gt;=0.62)</text>
  <text x="42" y="494" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">防毛线球: 每节点限 Top-3 隐式边，术语总度数 &lt;=32；爆炸半径默认隔离 L3</text>
  <text x="42" y="516" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">现网成效: 宿主机工程节点孤立率由 99.5% 压降至 0.5% (连通率 221/222)</text>
  <rect x="666" y="98" width="426" height="468" rx="8" fill="#FFFFFF" stroke="#1F7053" stroke-width="1.6"/>
  <text x="686" y="126" font-size="14" font-weight="700" fill="#15533C" text-anchor="start">宏微两级联邦推演 (Macro-Micro Federation)</text>
  <text x="686" y="148" font-size="12" font-weight="600" fill="#425863" text-anchor="start">PathStrength(P) = prod( w_e_i * 0.80^(i-1) )</text>
