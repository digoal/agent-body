<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="220" rx="8" fill="url(#bgGrad3)" stroke="#1e293b"/>
  <text x="400" y="30" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">⚡ 内核级端口防撞流水线与 AOPCC 自适应控制 (Port Guard)</text>

  <!-- Step 1 -->
  <rect x="25" y="55" width="165" height="80" rx="5" fill="#0f2647" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="107" y="78" fill="#bae6fd" font-size="9" font-weight="bold" text-anchor="middle">1. 内核态表直读</text>
  <text x="107" y="96" fill="#7dd3fc" font-size="8" text-anchor="middle">/proc/net/tcp + Platform</text>
  <text x="107" y="112" fill="#94a3b8" font-size="7.5" text-anchor="middle">解析 Hex 端口与 0A 监听态</text>
  <text x="107" y="125" fill="#34d399" font-size="7.5" font-weight="bold" text-anchor="middle">0.2ms 零子进程开销</text>

  <path d="M 190 95 L 225 95" stroke="#38bdf8" stroke-width="2"/>

  <!-- Step 2 -->
  <rect x="225" y="55" width="165" height="80" rx="5" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
  <text x="307" y="78" fill="#c7d2fe" font-size="9" font-weight="bold" text-anchor="middle">2. 属主与并发锁定</text>
  <text x="307" y="96" fill="#a78bfa" font-size="8" text-anchor="middle">反查 /proc/[pid]/fd</text>
  <text x="307" y="112" fill="#94a3b8" font-size="7.5" text-anchor="middle">校验多 Agent 协作锁表</text>
  <text x="307" y="125" fill="#38bdf8" font-size="7.5" font-weight="bold" text-anchor="middle">区分 Client 连 vs Server 绑</text>

  <path d="M 390 95 L 425 95" stroke="#818cf8" stroke-width="2"/>

  <!-- Step 3 -->
  <rect x="425" y="55" width="165" height="80" rx="5" fill="#311019" stroke="#f43f5e" stroke-width="1.2"/>
  <text x="507" y="78" fill="#fecaca" font-size="9" font-weight="bold" text-anchor="middle">3. Pre-Hook 痛觉拦截</text>
  <text x="507" y="96" fill="#fca5a5" font-size="8" text-anchor="middle">侦测端口冲突 / 死锁环路</text>
  <text x="507" y="112" fill="#94a3b8" font-size="7.5" text-anchor="middle">高风险写动作严控拦截</text>
  <text x="507" y="125" fill="#ef4444" font-size="7.5" font-weight="bold" text-anchor="middle">🚨 事前阻断，防止翻车</text>

  <path d="M 590 95 L 625 95" stroke="#f43f5e" stroke-width="2"/>

  <!-- Step 4 -->
  <rect x="625" y="55" width="150" height="80" rx="5" fill="#062e24" stroke="#10b981" stroke-width="1.2"/>
  <text x="700" y="78" fill="#d1fae5" font-size="9" font-weight="bold" text-anchor="middle">4. 智能推荐与自愈</text>
  <text x="700" y="96" fill="#6ee7b7" font-size="8" text-anchor="middle">返回安全空闲端口建议</text>
  <text x="700" y="112" fill="#ffffff" font-size="8" font-weight="bold" text-anchor="middle">[8081, 8082, 8083]</text>
  <text x="700" y="125" fill="#34d399" font-size="7.5" font-weight="bold" text-anchor="middle">Post-Hook &lt;2ms 注入处方</text>

  <rect x="25" y="155" width="750" height="45" rx="5" fill="#0f172a" stroke="#334155"/>
  <text x="400" y="175" fill="#e2e8f0" font-size="8.5" text-anchor="middle">🎯 AOPCC 核心平衡：客户端直连免轮次税，服务端绑定与锁争用零失误事前防撞。</text>
  <text x="400" y="190" fill="#38bdf8" font-size="8" text-anchor="middle">CLI: `agent-body env port 8080` | MCP: `body_port_check(port=8080)` | Hook: `body_hook_pre/post`</text>
</svg>
