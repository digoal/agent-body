[package]
name = "agent-body-probe"
version = "2.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Agent Body 政务云与极简 AIOps 探针发行版（纯 Rust、零 DuckDB/C++/WebUI 依赖）"

[[bin]]
name = "agent-body-probe"
path = "src/main.rs"

[dependencies]
agent-body-kernel = { path = "../../kernel/body-kernel" }
agent-body-protocol = { path = "../../kernel/body-protocol" }
agent-body-sdk = { path = "../../kernel/body-sdk" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ext-fdw-cmdb-ticket = { path = "../../contrib/fdw_cmdb_ticket" }
ext-hook-audit-siem = { path = "../../contrib/hook_audit_siem" }
ext-hook-auth-mtls-rbac = { path = "../../contrib/hook_auth_mtls_rbac" }
ext-hook-gov-compliance = { path = "../../contrib/hook_gov_compliance" }
ext-idx-fts-fuzzy = { path = "../../contrib/idx_fts_fuzzy" }
ext-probe-jvm-middleware = { path = "../../contrib/probe_jvm_middleware" }
ext-probe-linux-ops = { path = "../../contrib/probe_linux_ops" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.10"
