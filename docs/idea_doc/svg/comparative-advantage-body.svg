<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620">
  <rect width="1200" height="620" fill="#F7F6F2"/>
  <rect x="24" y="20" width="1152" height="580" fill="#F7F6F2" stroke="#D9D5CB" stroke-width="1"/>

  <!-- Header -->
  <text x="48" y="56" font-family="Songti SC, Noto Serif CJK SC, serif" font-size="24" font-weight="600" fill="#1B2B33">比较优势（Comparative Advantage）：为什么 Agent 必须配一个「Agent 本体」</text>
  <text x="48" y="82" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13.5" fill="#46585F">决定分工的不是「主战力会不会干琐事」，而是主战力干琐事的机会成本实在太高</text>
  <line x1="48" y1="98" x2="1152" y2="98" stroke="#D9D5CB" stroke-width="1"/>

  <!-- Top Row: 3 Human Metaphors -->
  <text x="48" y="124" font-family="SF Mono, monospace" font-size="11" letter-spacing="2" fill="#89938F">01 · 人类社会的三组默契分工</text>

  <rect x="48" y="138" width="352" height="146" fill="#FFFFFF" stroke="#D9D5CB" stroke-width="1"/>
  <rect x="48" y="138" width="352" height="4" fill="#245A6B"/>
  <text x="68" y="168" font-family="Songti SC, Noto Serif CJK SC, serif" font-size="17" font-weight="600" fill="#1B2B33">硅谷 101 创业园区</text>
  <text x="68" y="194" font-family="PingFang SC, sans-serif" font-size="13" fill="#46585F">后勤角色：园区物业包办水电餐食杂务</text>
  <text x="68" y="218" font-family="PingFang SC, sans-serif" font-size="13" fill="#245A6B" font-weight="600">主战角色：创业者负一楼连干一周写代码</text>
  <line x1="68" y1="234" x2="380" y2="234" stroke="#EAE6DD" stroke-width="1"/>
  <text x="68" y="258" font-family="PingFang SC, sans-serif" font-size="12" fill="#89938F">价值：足不出户，心流零打断</text>

  <rect x="424" y="138" width="352" height="146" fill="#FFFFFF" stroke="#D9D5CB" stroke-width="1"/>
  <rect x="424" y="138" width="352" height="4" fill="#2E6373"/>
  <text x="444" y="168" font-family="Songti SC, Noto Serif CJK SC, serif" font-size="17" font-weight="600" fill="#1B2B33">现代企业高管机制</text>
  <text x="444" y="194" font-family="PingFang SC, sans-serif" font-size="13" fill="#46585F">后勤角色：专职或共享幕僚团队过滤杂务日程</text>
  <text x="444" y="218" font-family="PingFang SC, sans-serif" font-size="13" fill="#245A6B" font-weight="600">主战角色：高管专一聚焦战略与核心决策</text>
  <line x1="444" y1="234" x2="756" y2="234" stroke="#EAE6DD" stroke-width="1"/>
  <text x="444" y="258" font-family="PingFang SC, sans-serif" font-size="12" fill="#89938F">价值：高杠杆时间不被行政琐事稀释</text>

  <rect x="800" y="138" width="352" height="146" fill="#FFFFFF" stroke="#D9D5CB" stroke-width="1"/>
  <rect x="800" y="138" width="352" height="4" fill="#47808D"/>
  <text x="820" y="168" font-family="Songti SC, Noto Serif CJK SC, serif" font-size="17" font-weight="600" fill="#1B2B33">家庭高效协同</text>
  <text x="820" y="194" font-family="PingFang SC, sans-serif" font-size="13" fill="#46585F">后勤角色：家庭主妇打理生活起居与家务</text>
  <text x="820" y="218" font-family="PingFang SC, sans-serif" font-size="13" fill="#245A6B" font-weight="600">主战角色：另一半全神贯注职场打拼创收</text>
  <line x1="820" y1="234" x2="1132" y2="234" stroke="#EAE6DD" stroke-width="1"/>
  <text x="820" y="258" font-family="PingFang SC, sans-serif" font-size="12" fill="#89938F">价值：各展比较优势，整体效能最大化</text>

  <!-- Bottom Row: Agent Era Before vs After -->
  <text x="48" y="316" font-family="SF Mono, monospace" font-size="11" letter-spacing="2" fill="#89938F">02 · 映射至 AI 智能体时代（实证案例：PostgreSQL 源码与生态调研）</text>

  <!-- Left: Without Agent Body -->
  <rect x="48" y="330" width="536" height="244" fill="#F7E9DE" stroke="#BE653B" stroke-width="1"/>
  <rect x="48" y="330" width="4" height="244" fill="#BE653B"/>
  <text x="70" y="362" font-family="Songti SC, Noto Serif CJK SC, serif" font-size="18" font-weight="600" fill="#BE653B">无Agent 本体（裸奔 Agent）：每次重头折腾</text>
  <rect x="70" y="382" width="492" height="44" fill="#FFFFFF" stroke="#D9D5CB" stroke-width="1"/>
  <text x="86" y="409" font-family="PingFang SC, sans-serif" font-size="13" fill="#1B2B33">1. 收到「调研 PostgreSQL 特性」任务，不知本机已有现成环境</text>
  <rect x="70" y="438" width="492" height="44" fill="#FFFFFF" stroke="#D9D5CB" stroke-width="1"/>
  <text x="86" y="465" font-family="PingFang SC, sans-serif" font-size="13" fill="#1B2B33">2. 重新 git clone 源码 → ./configure → make 编译 → 装依赖</text>
  <rect x="70" y="494" width="492" height="58" fill="#FFFFFF" stroke="#BE653B" stroke-width="1"/>
  <text x="86" y="518" font-family="PingFang SC, sans-serif" font-size="13" font-weight="600" fill="#BE653B">结果：浪费 20+ 分钟时间 · 重复占用数 GB 磁盘 · 白烧云端 Token</text>
  <text x="86" y="540" font-family="PingFang SC, sans-serif" font-size="12" fill="#46585F">最宝贵的推理算力，全耗在「找材料、搭环境」的体力活上</text>

  <!-- Right: With Agent Body -->
  <rect x="616" y="330" width="536" height="244" fill="#E5EFF0" stroke="#245A6B" stroke-width="1"/>
  <rect x="616" y="330" width="4" height="244" fill="#2F7A66"/>
  <text x="638" y="362" font-family="Songti SC, Noto Serif CJK SC, serif" font-size="18" font-weight="600" fill="#245A6B">配了「Agent 本体」Agent Body：各司其职</text>
  <rect x="638" y="382" width="492" height="44" fill="#FFFFFF" stroke="#7BA6AF" stroke-width="1"/>
  <text x="654" y="409" font-family="PingFang SC, sans-serif" font-size="13" fill="#1B2B33">1. 开工先问Agent 本体：body_brief / body_asset_search("postgres")</text>
  <rect x="638" y="438" width="492" height="44" fill="#FFFFFF" stroke="#7BA6AF" stroke-width="1"/>
  <text x="654" y="465" font-family="PingFang SC, sans-serif" font-size="13" fill="#1B2B33">2. 0.4ms 命中本机 /root/new/src/postgres 等 17+ PG 树与 .codegraph</text>
  <rect x="638" y="494" width="492" height="58" fill="#FFFFFF" stroke="#2F7A66" stroke-width="1"/>
  <text x="654" y="518" font-family="PingFang SC, sans-serif" font-size="13" font-weight="600" fill="#2F7A66">结果：主战 Agent 零折腾直奔内核推理，省时 · 省空间 · 省 Token</text>
  <text x="654" y="540" font-family="PingFang SC, sans-serif" font-size="12" fill="#46585F">Agent 本体负责本地记忆与物理盘点，主战大模型专注高阶创造</text>
</svg>
