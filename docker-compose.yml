services:
  agent-body:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-body:latest
    container_name: agent-body
    restart: unless-stopped
    pid: "host"                  # 透传宿主 PID 命名空间（自带宿主 /proc 视图，严禁再额外挂载覆盖 /proc）
    network_mode: "host"         # 推荐 host 网络模式，以便精准采集宿主机监听端口占用（Web/Mesh 默认 :8765）
    volumes:
      - ${AGENT_BODY_DATA_DIR:-~/.agent-body}:/root/.agent-body # 持久化 SQLite 元数据库与配置文件
      - ${AGENT_BODY_WORKSPACE:-./workspace}:/workspace         # 按需挂载待纳管工作目录（本机可设 AGENT_BODY_WORKSPACE=~/new）
    environment:
      - RUST_LOG=info
      - AGENT_BODY_CONFIG=/root/.agent-body/config.toml
      # 可选设置为 json 开启单行 JSONL 结构化日志并透传 W3C traceparent
      - AGENT_BODY_LOG_FORMAT=${AGENT_BODY_LOG_FORMAT:-text}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8765/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: ["daemon"]
