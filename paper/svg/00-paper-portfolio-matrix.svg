  <rect x="330" y="98" width="460" height="30" rx="7" fill="#E7F2F5" stroke="#1D5B70" stroke-width="1.2"/>
  <text x="344" y="118" font-size="14" font-weight="700" fill="#134252" text-anchor="start">Paper 01 · 奠基旗舰系统论文 [OSDI / SOSP / EuroSys]</text>
  <text x="344" y="146" font-size="12" font-weight="400" fill="#162A33" text-anchor="start">核心命题: Brain-Body Separation (脑体分离具身底座)</text>
  <text x="344" y="166" font-size="12" font-weight="400" fill="#162A33" text-anchor="start">理论突破: AOPCC 整轮对话税期望代价不等式 + &lt;2ms 碰壁自愈</text>
  <text x="344" y="186" font-size="12" font-weight="400" fill="#162A33" text-anchor="start">系统原语: BodyManifest · ContinuityCapsule v2 · L0~L3 包络</text>
  <text x="344" y="206" font-size="12" font-weight="400" fill="#162A33" text-anchor="start">实证支撑: W1~W22 全栈帕累托净升 + COMP-C1~C4 同机实跑对标</text>
  <rect x="28" y="290" width="252" height="286" rx="7" fill="#FFFFFF" stroke="#1F7053" stroke-width="1.6"/>
  <rect x="28" y="290" width="252" height="30" rx="7" fill="#E6F4EC" stroke="#1F7053" stroke-width="1.2"/>
  <text x="42" y="310" font-size="13" font-weight="700" fill="#15533C" text-anchor="start">Paper 02 · 数据库 [SIGMOD]</text>
  <text x="42" y="338" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">命题: 事务级海马体 (Scheme A→B)</text>
  <text x="42" y="362" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">矛盾: 6 个数量级时间不对称性</text>
  <text x="42" y="386" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">机制 1: 双时态 MVCC + 同键微锁</text>
  <text x="42" y="410" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">机制 2: STC 空闲睡眠整理 (3.73x)</text>
  <text x="42" y="434" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">机制 3: 零 BLOB 快权重三门禁</text>
  <text x="42" y="458" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">机制 4: QueryPredictabilityGate</text>
  <text x="42" y="482" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">PG 18.6: 1,000,003 行 P99 4.42ms</text>
  <text x="42" y="506" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">故障拦截: 3 类退化 100% 原子中止</text>
