[package]
name = "ext-obs-telemetry"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Agent Body 标准可观测导出与自诊断扩展（Prometheus/OpenMetrics 0.0.4、W3C Trace、JSONL 与异常自诊断）"

[dependencies]
agent-body-sdk = { path = "../../kernel/body-sdk" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
agent-body-kernel = { path = "../../kernel/body-kernel" }
