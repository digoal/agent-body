[package]
name = "agent-body"
version = "1.0.0"
edition = "2021"
authors = ["digoal 德哥"]
description = "Agent Body — 脑体分离架构的 Agent 本体（宿主机具身底座，Rust Edition）"
license = "Apache-2.0"

[dependencies]
# 异步运行时
tokio = { version = "1.37", features = ["full"] }

# 命令行解析
clap = { version = "4.5", features = ["derive", "cargo"] }

# 序列化与配置
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# 时间与唯一 ID
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
sha2 = "0.11"

# SQLite 嵌入式存储 (含 FTS5 全文检索)
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }

# PostgreSQL 高性能客户端 (支持 pgvector & JSONB)
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-serde_json-1"] }

# 系统信息采集与进程监控
sysinfo = "0.30"

# 文件路径与匹配
walkdir = "2.5"
glob = "0.3"
globset = "0.4"
regex = "1.10"
notify = "6.1"
rayon = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
urlencoding = "2.1"
duckdb = { version = "1.20000.2", features = ["bundled", "chrono"] }

[dev-dependencies]
tempfile = "3.10"
