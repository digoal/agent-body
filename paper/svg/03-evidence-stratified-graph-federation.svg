  <text x="702" y="356" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">按需穿透仓库 .codegraph/ 符号级索引</text>
  <text x="702" y="376" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">定位修改函数 StorageProvider::upsert_asset</text>
  <text x="702" y="396" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">追踪跨模块动态派发调用链 (Callers/Callees)</text>
  <rect x="688" y="446" width="382" height="102" rx="7" fill="#FFFFFF" stroke="#B56917" stroke-width="1.6"/>
