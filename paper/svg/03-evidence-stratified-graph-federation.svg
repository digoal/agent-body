  <text x="702" y="494" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">精确合并: 微观受影响 Rust 函数签名</text>
  <text x="702" y="514" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">+ 宏观受波及 Systemd 服务与定时任务</text>
