# ==============================================================================
# Agent Body (Agent 本体) — 配置文件参考模板
# ==============================================================================
#
# 配置文件默认查找路径:
#   1. 命令行参数: agent-body --config <path> ... (最高优先级)
#   2. 环境变量: AGENT_BODY_CONFIG
#   3. 用户家目录: ~/.agent-body/config.toml (默认路径)
#
# 首次运行任何 agent-body 命令时，若上述路径均不存在配置文件，
# 系统将自动根据本模板创建默认的 ~/.agent-body/config.toml。
# ==============================================================================

# 基础数据存储目录 (SQLite 数据库、本地缓存、备份文件均存放于此)
# 依赖: 该目录必须具备当前运行用户的读写权限，且磁盘剩余空间建议 >= 100MB
# 默认: "$HOME/.agent-body"
# data_dir = "~/.agent-body"

# SQLite 主存储数据库文件绝对路径
# 默认: "{data_dir}/body.db"
# db_path = "~/.agent-body/body.db"

# ==============================================================================
# [workspace] 可移植工作区与安全临时目录配置 (Phase 55)
# ==============================================================================
# 说明:
#   - 默认自动适应宿主机: 若 $HOME/new 存在则沿用；否则自动采用 $HOME/agent-body-workspace
#     与系统临时目录 (std::env::temp_dir()/agent-body)，无需手动修改即可跨主机开箱运行。
[workspace]
# base_dir = "~/agent-body-workspace"
# workspace_roots = ["~/agent-body-workspace/work", "~/agent-body-workspace/shared_proj", "~/agent-body-workspace/src", "~/agent-body-workspace/shared_git"]
# temp_dir = "/tmp/agent-body"
# skills_dirs = ["~/.agent-body/skills", "~/.gemini/antigravity-cli/skills"]
# notes_dirs = ["~/agent-body-workspace/note"]
# shared_git_dirs = ["~/agent-body-workspace/shared_git"]

# ==============================================================================
# [memory] 长期记忆引擎适配器配置 (由 MemoryFactory 真实加载)
# ==============================================================================
[memory]
# 可选值: "builtin" (默认, 内置 SQLite FTS5+向量) | "pg_tx" (Phase 76 PostgreSQL 双时态事务记忆) | "powercontext" | "mem0" | "letta"
provider = "builtin"
# Phase 76: PostgreSQL 事务级记忆连接串 (留空自动回退 [storage].pg_url 或 AGENT_BODY_MEMORY_PG_URL)
# pg_url = "host=127.0.0.1 port=5432 user=postgres dbname=agent_body"
# pg_pool_size = 8
# pg_tenant_scope = "default"
# vector_backend = "none" # 可选: "none" | "pgvector" | "pg_vectorsearch" | "external_lsm"
# fallback_to_sqlite = true # PG 不可达时自动无损降级为本地 SQLite 零依赖模式
# sleep_compaction_enabled = true # Phase 77: L1_AUTONOMIC 空闲窗口期自动执行睡眠整理
# sleep_idle_cpu_pct = 45.0       # Phase 77: 空闲窗口 CPU 负载阈值 (%)
# sleep_min_events = 4            # Phase 77: 单主题最小触发事件数
# sleep_max_batch = 64            # Phase 77: 单轮最大扫描事件批大小
# fast_weight_enabled = false     # Phase 78 (方案 B / M3): 启用旁路快权重血缘控制面
# fast_weight_runtime_url = ""    # Phase 78: 外部 Model Runtime HTTP JSON-RPC 2.0 地址
# fast_weight_max_norm_ratio = 1.50    # Phase 78: 范数防雪崩上限
# fast_weight_min_glue_delta = -0.03   # Phase 78: 通用能力回归红线 (< 3% 衰减)
# fast_weight_max_unlearn_leak = 0.001 # Phase 78: 定向遗忘墓碑诱导泄漏率上限 (< 0.1%)
# powercontext_url = "http://127.0.0.1:8000"
# powercontext_scope_id = "default"
# mem0_url = "https://api.mem0.ai"
# mem0_api_key_env = "MEM0_API_KEY"
# mem0_user_id = "agent-body"
# letta_url = "http://127.0.0.1:8283"
# letta_agent_id = ""
# letta_token_env = "LETTA_API_TOKEN"

# ==============================================================================
# [storage] 多存储引擎与后端配置
# ==============================================================================
[storage]
# 主存储后端选择
# 可选值:
#   - "sqlite": 嵌入式单文件数据库 (默认，零外部依赖，内置 FTS5 全文索引，极速单机)
#   - "postgres": 外部高并发关系数据库 (需安装 PostgreSQL >= 14 并启用 pgvector 扩展)
#   - "duckdb": 嵌入式列存分析库 (用于大批量日志/变更时序离线分析)
# 默认: "sqlite"
provider = "sqlite"

# PostgreSQL 连接串 (仅当 provider = "postgres" 时必须配置)
# 格式示例: "host=127.0.0.1 port=5432 user=agent_body password=secret dbname=agent_body"
# 依赖要求: 
#   1. PostgreSQL 服务处于监听状态
#   2. 数据库已执行 CREATE EXTENSION IF NOT EXISTS vector;
#   3. DDL 迁移可通过 `agent-body storage migrate --to postgres` 自动导入
# pg_url = "host=localhost port=5432 user=agent_body dbname=agent_body"

# DuckDB 数据库文件路径 (若不填则默认为 {data_dir}/body.duckdb)
# duckdb_path = "~/.agent-body/body.duckdb"

# ==============================================================================
# [embedding] 语义向量嵌入服务配置 (可选，与下方 [annotation] 职责严格分离)
# ==============================================================================
# 作用范围: 统一控制长期记忆写入与混合检索 (HybridSearchEngine)、核心资产向量化、
#           以及 Fact 节点向量化的 Ollama 端点、模型名称与维度。
#
# ⚠️ 更改 Embedding 模型必读注意事项:
#   1. 模型与维度必须严格一致: `dimensions` 必须等于所选模型的实际输出维度，
#      否则校验或向量检索将无法匹配。
#   2. 更换模型后必须重建存量向量: 不同 Embedding 模型的向量空间与维度互不兼容。
#      若从 768 维模型 (如 nomic-embed-text) 切换为 1024 维模型 (如 bge-m3:latest)
#      或同维度的其他模型，数据库内已有的 `memories.embedding`、`assets.embedding`
#      和 `fact_nodes.embedding` 必须清空并重新生成，否则新旧向量混用会导致检索失效或
#      余弦相似度失真！(若使用 PostgreSQL + pgvector，还需同步确认列维度与索引)
#   3. 职责边界: 本段仅用于文本向量化 (/api/embeddings)，切勿填入对话/生成模型；
#      提炼注释与结构化描述元数据请配置下方的 [annotation] 段。
[embedding]
# 本地或内网 Ollama 嵌入服务地址
# 依赖要求: 本机或内网需安装 Ollama (https://ollama.com) 并已启动服务
# 默认: "http://localhost:11434"
ollama_url = "http://localhost:11434"

# 文本向量化嵌入模型名称 (使用前需先执行 `ollama pull <model>`)
# 常见模型与对应维度参考:
#   - "nomic-embed-text": 768 维，极速且显存/内存开销小 (默认)
#   - "bge-m3:latest": 1024 维，高质量中文与代码双语混合嵌入
#   - "qwen3-embedding:0.6b": 1024 维，轻量多语言嵌入
#   - "all-minilm": 384 维，超轻量英文嵌入
# 默认: "nomic-embed-text"
model = "nomic-embed-text"

# 向量维度 (必须与上方 model 的实际输出维度完全一致)
#   - nomic-embed-text 为 768
#   - bge-m3:latest / qwen3-embedding:0.6b 为 1024
#   - all-minilm 为 384
# 默认: 768
dimensions = 768

# 当 Ollama 服务离线、模型未拉取或请求超时时，是否自动降级为 SQLite FTS5 纯全文检索
# 建议: true (确保系统在断网或 Ollama 异常时依然能检索记忆，绝不崩溃)
# 默认: true
fallback_fts_only = true

# ==============================================================================
# [assets] 资产分级扫描与监听配置
# ==============================================================================
[assets]
# 后台常驻守护进程 (daemon) 启动时自动递归扫描与监听的核心目录列表
# 建议: 仅配置日常存放代码、脚本、资料的工作目录；切勿配置根目录 "/" 或超大目录
# 默认: 空数组 (启动时自动根据 [workspace].workspace_roots 查找并纳管存在的工程目录)
auto_scan_dirs = [
    # "~/agent-body-workspace/work",
    # "~/agent-body-workspace/shared_proj"
]

# 扫描与监听时全局忽略的文件与目录模式 (Glob 表达式)
# 白名单优先深挖到底，命中以下模式的目录将严格止于当前层级，绝不下钻
ignore_patterns = [
    ".git",
    "node_modules",
    "__pycache__",
    ".agent-body",
    "target",
    ".venv",
    ".idea",
    ".vscode",
    "dist",
    "build",
    ".next",
    ".nuxt",
    ".cache",
    "coverage",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache"
]

# ==============================================================================
# [placement] 新对象放置建议与命名规范配置
# ==============================================================================
[placement]
# 默认新建资产的属主标识 (不配置时自动推导为 "user:$USER"，缺省 "user:local")
# default_owner = "user:local"

# 默认安全分级
# 可选值: "public" | "internal" | "confidential" | "secret"
# 默认: "internal"
default_security_level = "internal"

# ─────────────────────────────────────────────────────────────────────────────
# 6. Web UI 与可视化监控大屏配置 (Web Dashboard)
# ─────────────────────────────────────────────────────────────────────────────
[web]
# 是否随 daemon 守护进程自动拉起 Web 监控大屏
# 取值: true / false
# 默认: true
enabled = true

# HTTP 服务监听地址
# 取值: "127.0.0.1" (仅限本机，推荐安全默认值) 或 "0.0.0.0" (允许局域网/跨主机访问看板)
# 默认: "127.0.0.1"
host = "127.0.0.1"

# HTTP 服务监听端口
# 取值: 1024 ~ 65535
# 默认: 8765
port = 8765

# 管理员受控运维操作鉴权 Token (可选)
# 若留空，则 Web 看板为只读监控模式；配置后，POST /api/v1/locks/release 等写端点需携带该 Bearer Token
# 可观测说明 (Phase 74): Web 端内置暴露 GET /metrics (OpenMetrics 0.0.4) 与全响应 X-Trace-Id / traceparent；
# 设置环境变量 AGENT_BODY_LOG_FORMAT=json 可切换守护进程与 Web 关键事件为单行 JSONL 日志
# auth_token = "agent-body-admin-secret"

# ==============================================================================
# 7. HOOK 事件总线与外部扩展规则 (Hooks Engine - Phase 14)
# ==============================================================================
# 支持事件类型:
#   - on_file_created / on_file_modified / on_file_deleted
#   - on_asset_registered
#   - on_memory_added / on_memory_updated
#   - on_service_status_changed / on_port_changed
#   - on_lock_acquired / on_lock_released
#   - on_session_started / on_session_closed
#
# 动作 action:
#   - exec: 执行本地命令或脚本 ({path}, {event} 占位符支持)
#   - webhook: 向指定 URL 投递 HTTP POST JSON
# 默认值: [] (不配置 [[hooks]] 即为空规则集)
#
# 示例 1: 当在核心工作区创建 Markdown 文件时，自动执行本地扫描
# [[hooks]]
# event = "on_file_created"
# filter = { path_prefix = "/path/to/workspace/work", extensions = [".md"] }
# action = "exec"
# command = "agent-body asset scan {path} --depth 1"
#
# 示例 2: 长期记忆写入时，向外部通知中枢发送 Webhook (3秒超时)
# [[hooks]]
# event = "on_memory_added"
# filter = { tags_contain = ["decision", "architecture"] }
# action = "webhook"
# url = "http://127.0.0.1:8765/api/v1/notify"
# timeout_ms = 3000

# ==============================================================================
# 8. HOOK Pipeline 链式编排引擎 (Phase 14.6)
# ==============================================================================
# 支持多步骤串联、条件过滤、防抖幂等与失败策略 (abort / continue)
# [[pipelines]]
# id = "pipe-docs-sync"
# name = "文档自动化建链编排"
# event_pattern = "on_file_created"
# debounce_ms = 500
# [[pipelines.steps]]
# name = "step-scan-asset"
# action = { action = "exec", command = "agent-body asset scan {path} --depth 1" }
# filter = { path_prefix = "/path/to/workspace/work", extensions = [".md"] }
# on_failure = "abort"
# timeout_ms = 3000
# [[pipelines.steps]]
# name = "step-notify-webhook"
# action = { action = "webhook", url = "http://127.0.0.1:8765/api/v1/notify", timeout_ms = 3000 }
# on_failure = "continue"

# ==============================================================================
# 9. 生态目录 (MCP / SKILL / 外部服务通讯录) 与 Context 防爆路由 (Phase 16)
# ==============================================================================
# 默认扫描路径 (可在 [workspace].skills_dirs 中覆盖):
#   - MCP 配置: ~/.hermes/config.yaml, ~/.gemini/antigravity-cli/mcp_config.json,
#               ~/.config/claude/claude_desktop_config.json, ~/.cursor/mcp.json
#   - SKILL 目录: {workspace.base_dir}/skills, ~/.agent-body/skills,
#                 ~/.gemini/antigravity-cli/skills, ~/.gemini/antigravity-cli/builtin/skills
# 安全约束:
#   - 扫描 MCP 配置时强制剥离 env 明文密钥，仅保留变量名；
#   - external_services 严禁存储任何明文 API Key/Token/Password。

# ==============================================================================
# 10. 轻量多机联邦 Peer Mesh 配置 (Phase 18)
# ==============================================================================
[mesh]
# 是否启用联邦客户端能力（服务端 /api/v1/mesh/* 随 [web] 服务自动暴露）
# 默认: false
enabled = false
# 对等节点 Web 基地址列表（当 enabled = true 且 peers 非空时，各节点必须配置相同的 [web].auth_token 作为共享密钥）
# 示例: peers = ["http://192.168.31.161:8765"]
peers = []
# 单次对等节点请求超时（毫秒）
# 默认: 1500
timeout_ms = 1500
# 本机节点标识（缺省自动取操作系统 hostname）
# node_id = "node-beijing-01"
# Mesh HMAC-SHA256 共享签名密钥（缺省回退至 [web].auth_token）
# shared_secret = "change-me-strong-mesh-secret"
# 信封时间戳防重放时间窗（秒，默认 300）
replay_window_secs = 300
# 跨机受控文件投递体积上限（字节，默认 10MB）
max_transfer_bytes = 10485760
# 跨机文件隔离沙盒收件箱路径（默认 ~/.agent-body/mesh_inbox，严格 0700 权限）
# inbox_dir = "~/.agent-body/mesh_inbox"
# 按节点独立共享密钥与最小作用域授权（可选）
# [mesh.peer_keys]
# "node-gpu-02" = "peer-specific-secret"
# [mesh.peer_scopes]
# "node-gpu-02" = ["read:facts", "write:locks", "exchange:dialogue", "transfer:artifact"]

# ==============================================================================
# 11. 资产语义元数据 Ollama 自动标注配置 (Phase 23 - ISSUE #8)
# ==============================================================================
# 作用范围: 从核心资产文件头部摘录中提炼结构化元数据 (domain / purpose / capabilities /
#           entry_point)，用于 L2 语义标注精炼。
#
# ⚠️ 更改元数据提炼模型必读注意事项:
#   1. 职责边界: 本段调用 Ollama `/api/generate`，必须选择具备文本生成与指令遵循
#      能力的对话/推理模型 (如 qwen3.5:0.8b、qwen3.5:4b、llama3.1:8b 等)，
#      切勿填入 nomic-embed-text / bge-m3 等纯 Embedding 模型！
#   2. 存量资产处理: 更换 [annotation].model 不会影响向量维度 (无需重建 Embedding)，
#      但已标注过的资产不会自动重跑；如需用新模型重新提炼，可触发扫描精炼或重置状态。
#   3. 性能与超时匹配: 若切换为更大参数的模型 (如 4B/8B) 或纯 CPU 推理，单文件耗时
#      会显著增加，请同步调大 `timeout_ms` (如 30000~60000) 并适当调小
#      `auto_enrich_batch_size`，避免守护进程巡检超时降级为 L1 确定性提取。
#   4. 隐私与开关: 送入模型的片段已强制经 SecretRedactor 脱敏且自动跳过敏感文件；
#      若希望完全禁用本地生成模型推理，设置 `enabled = false` 即可。
[annotation]
# 是否启用本地 Ollama 小模型语义标注精炼（关闭或离线时自动降级为 L1 确定性提取）
# 默认: true
enabled = true
# 本地 Ollama 服务地址
# 默认: "http://localhost:11434"
ollama_url = "http://localhost:11434"
# 用于提炼注释与元数据的轻量生成模型 (使用前需先执行 `ollama pull <model>`)
# 推荐轻量模型: qwen3.5:0.8b (CPU 单核/多核实测 ~3s/文件, 零云端 Token)
# 默认: "qwen3.5:0.8b"
model = "qwen3.5:0.8b"
# 单文件推理超时（毫秒，更换更大模型时请同步调大）
# 默认: 15000
timeout_ms = 15000
# 送入小模型的文件头部摘录字符上限（自动经过 SecretRedactor 脱敏）
# 默认: 1200
max_snippet_chars = 1200
# 守护进程每次巡检自动异步精炼的资产批量上限
# 默认: 10
auto_enrich_batch_size = 10
# 是否对图片资产 (png/jpg/webp 等) 启用 Ollama Vision 视觉模型增强理解 (ISSUE #42)
# 关闭或未拉取视觉模型时，仍保留 L1 纯 Rust 图片宽高/色彩/SVG 文本提取能力
# 默认: false
vision_enabled = false
# 本地视觉理解模型名称 (推荐 qwen3.5:0.8b，原生支持视觉且与文本标注共享同一模型，零额外换页开销；需先 `ollama pull <vision_model>`)
# 默认: "qwen3.5:0.8b"
vision_model = "qwen3.5:0.8b"
# 送入本地视觉模型的单张图片最大字节数 (默认 4MB)
# 默认: 4194304
vision_max_image_bytes = 4194304
# 是否允许按有界超时调用宿主机只读工具 (pdfinfo/pdftotext/ffprobe，默认 true；关闭时纯 Rust 解析)
multimodal_tools_enabled = true
# 多模态外部工具探针单次超时上限 (ms，默认 500)
multimodal_tool_timeout_ms = 500

# ==============================================================================
# 12. 三态运行模式、真实世界 A/B 对照与 MCP 工具档位配置 (Phase 58 - ISSUE #43)
# ==============================================================================
[runtime]
# 运行模式 (亦可通过环境变量 AGENT_BODY_MODE 临时热覆盖):
#   - "body_only": 默认模式，仅使用 agent-body 索引与稳态防撞能力
#   - "bypass":    完全旁路 agent-body（Hook/Brief/Search 零拦截直通原生命令，用于基线对照）
#   - "shadow_ab": 真实运行期双轨对照（同时执行原生实时搜索与 agent-body 索引查询，
#                  异步落盘延时/Token/命中差异/陈旧率至 audit_events 供 DuckDB 分析）
mode = "body_only"

# MCP tools/list 工具暴露档位 (亦可通过环境变量 AGENT_BODY_MCP_PROFILE 覆盖):
#   - "full": 暴露全部 43 个原生 MCP 工具（默认，向后兼容）
#   - "core": 仅暴露 10 个高频核心工具（Schema 体积压降 ~78%，大幅减少每轮上下文工具税）
#   - "dev":  研发常用 18 个工具
#   - "ops":  运维/治理常用 20 个工具
mcp_profile = "full"

# shadow_ab 模式下返回给 Agent 的主结果侧 ("live" | "body")
# 默认 "live"：以实时搜索为主响应保证零陈旧风险，同时在后台收集 body 对比数据
shadow_primary = "live"

# shadow_ab / bypass 模式下实时工作区扫描的时间预算上限（毫秒）
shadow_max_live_ms = 800

# shadow_ab 采样率 (0.0..=1.0)
ab_sample_rate = 1.0

# shadow_ab 检测到 H1 漏召回 / H2 幽灵陈旧命中时是否写穿自愈索引 (默认 true)
auto_heal_on_hindering = true

# Phase 80: PreToolUse 原生 Token 守卫（无需第三方 MCP，拦截噪音目录/锁文件/单行压缩文本整读，
# 大文件自动注入 StartLine/EndLine 首屏切片，rg/grep/find 自动补过滤与输出上限）
# 可通过环境变量 AGENT_BODY_TOKEN_GUARD=0 或 AGY_TOKEN_OPTIMIZER=0 临时旁路
token_guard_enabled = true
# 允许整读的单文件最大字节数（默认 36864 = 36KB）
token_guard_max_full_read_bytes = 36864
# 允许整读的单文件最大行数（默认 600）
token_guard_max_full_read_lines = 600
# 触发大文件自动切片时的首屏读取行数上限（默认 250）
token_guard_auto_slice_lines = 250
# 独立 rg / grep -r / find 搜索命令自动截断输出行数上限（默认 180）
token_guard_search_max_lines = 180

# ==============================================================================
# 13. 行业 Know-How 知识网络与 Omni-RRF 多路融合检索配置 (Phase 61 - ISSUE #44)
# ==============================================================================
[knowledge_graph]
# 是否启用 L1 确定性知识网络与图扩展检索
# 默认: true
enabled = true

# Heading-Aware 章节语义切片的最大字符数
# 默认: 900
max_section_chars = 900

# 跨章节 PMI 点互信息共现边阈值（越大越严格，防止毛线球连接）
# 默认: 1.2
pmi_threshold = 1.2

# 是否在 Omni-RRF 中启用纯 Rust Fuzzy 模糊检索通道
# 默认: true
fuzzy_enabled = true

# 层级结构通道（文档章节父/兄 + 目录局部性）基础权重
# 默认: 0.60
hierarchy_boost = 0.60

# 文档间互链通道（links 表 + documented_by）基础权重
# 默认: 0.65
doc_link_boost = 0.65

# 是否允许后台批处理使用本地 Ollama (qwen3.5:0.8b) 进行章节级因果 Know-How 抽取 (Phase 62)
# 默认: false
l2_extract_enabled = false

# 检索时默认图谱扩展跳数 (0 | 1 | 2)
# 默认: 1
default_search_hops = 1

# 是否启用数据库侧三元组模糊索引加速 (SQLite FTS5 trigram / PG pg_trgm，ISSUE #56)
# 默认: true (关闭时自动退化为纯数据库 LIKE/ILIKE 全文扫描，无损切换)
db_fuzzy_index = true

# 单文件入库索引脱敏正文 content_text 最大字节上限 (默认 131072 = 128KB，大文件保留首尾)
max_index_content_bytes = 131072

# 语义向量召回最低余弦相似度门禁 (默认 0.58，防止弱相似无关资产充当多余噪音)
min_vec_similarity = 0.58

# 对严格代码标识符查询启用精准门禁 (已命中精确/模糊/FTS 时不再填充纯语义弱相关噪声)
strict_identifier_vec_gate = true

# Relate 嵌入式 openCypher 图谱引擎 (contrib/graph_relate + librelate_ffi.so v2)
# 默认: false（保持零额外运行时依赖；开启后可通过 `links relate-sync` 同步并加速多跳推演）
relate_enabled = false
# Relate 图库存储路径（留空默认 {data_dir}/graph.rl）
# relate_db_path = "~/.agent-body/graph.rl"
# 可选显式指定 librelate_ffi.so 路径（留空按 RELATE_LIB -> /usr/local/lib -> /usr/lib 探测）
# relate_lib_path = "/usr/local/lib/librelate_ffi.so"
relate_timeout_ms = 5000
relate_max_rows = 200
# 当 librelate_ffi.so 不可用或未同步时是否自动无损回退 SQLite/PG
relate_fallback_to_sqlite = true

# 自定义行业术语别名归一化映射（自动与内置 PG/FTS5/SQLite/DuckDB 等合并）
[knowledge_graph.aliases]
# "pgvector" = "pgvector"





