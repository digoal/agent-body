<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 540" width="100%" height="auto" font-family="PingFang SC, Noto Sans CJK SC, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrK1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#245A6B"/>
    </marker>
    <marker id="arrK2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#BE653B"/>
    </marker>
    <marker id="arrK3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2F7A66"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1160" height="540" fill="#F7F6F2"/>
  <rect x="14" y="14" width="1132" height="512" rx="6" fill="none" stroke="#D9D5CB" stroke-width="1.2"/>

  <!-- 标题 -->
  <text x="36" y="44" fill="#1B2B33" font-size="20" font-weight="700">微内核 (kernel/) 与周边 (contrib/) 物理隔离、包规范及四阶段演进时序</text>
  <text x="36" y="65" fill="#46585F" font-size="11.5">Physical Directory Isolation · PostgreSQL-Style Contrib Anatomy · Strict Kernel-First Evolution Order</text>
  <line x1="36" y1="76" x2="1124" y2="76" stroke="#D9D5CB" stroke-width="1"/>

  <!-- 左侧：物理目录拓扑与单向依赖 -->
  <rect x="36" y="92" width="520" height="416" rx="6" fill="#F1EFE9" stroke="#245A6B" stroke-width="1.2"/>
  <text x="54" y="115" fill="#245A6B" font-size="13.5" font-weight="700">1. 目标仓库三级物理目录与单向依赖拓扑</text>

  <!-- distributions/ -->
  <rect x="58" y="132" width="476" height="72" rx="5" fill="#F7E9DE" stroke="#BE653B" stroke-width="1.1"/>
  <text x="74" y="153" fill="#BE653B" font-size="12" font-weight="700">distributions/（发行版装配层 · Cargo Binaries）</text>
  <text x="74" y="172" fill="#1B2B33" font-size="10.5">• kernel-minimal/   (纯内核零 contrib 编译验证包)</text>
  <text x="74" y="189" fill="#1B2B33" font-size="10.5">• personal-flagship/ · aiops-probe/ · dba-sentinel/</text>

  <line x1="296" y1="204" x2="296" y2="228" stroke="#BE653B" stroke-width="1.5" marker-end="url(#arrK2)"/>

  <!-- contrib/ -->
  <rect x="58" y="232" width="476" height="104" rx="5" fill="#EBF5F0" stroke="#2F7A66" stroke-width="1.2"/>
  <text x="74" y="253" fill="#2F7A66" font-size="12" font-weight="700">contrib/（周边扩展生态层 · 允许依赖 body-sdk，互不耦合）</text>
  <text x="74" y="272" fill="#1B2B33" font-size="10.5">• 存储/索引：am_postgres, am_duckdb_olap, idx_ollama_vec, idx_knowhow_graph</text>
  <text x="74" y="289" fill="#1B2B33" font-size="10.5">• 探针/FDW：probe_host_basic, probe_linux_ops, probe_jvm_middleware, fdw_cmdb</text>
  <text x="74" y="306" fill="#1B2B33" font-size="10.5">• 合规Hook：hook_auth_mtls_rbac, hook_gov_compliance, hook_audit_siem</text>
  <text x="74" y="323" fill="#1B2B33" font-size="10.5">• 治理/界面：gov_placement, gov_host_gc, fed_peer_mesh, ui_web_console, bench</text>

  <line x1="296" y1="336" x2="296" y2="360" stroke="#2F7A66" stroke-width="1.5" marker-end="url(#arrK3)"/>

  <!-- kernel/ -->
  <rect x="58" y="364" width="476" height="126" rx="5" fill="#E5EFF0" stroke="#245A6B" stroke-width="1.4"/>
  <text x="74" y="385" fill="#245A6B" font-size="12" font-weight="700">kernel/（纯微内核层 · 禁止出现任何 contrib/ 依赖或业务硬编码）</text>
  <rect x="74" y="396" width="214" height="78" rx="4" fill="#F7F6F2" stroke="#245A6B" stroke-width="0.9"/>
  <text x="181" y="416" text-anchor="middle" fill="#245A6B" font-size="11" font-weight="700">kernel/body-sdk</text>
  <text x="181" y="434" text-anchor="middle" fill="#46585F" font-size="9.5">6 大 Routine Trait</text>
  <text x="181" y="449" text-anchor="middle" fill="#46585F" font-size="9.5">7 大 Hook 接口 &amp; EvidenceTuple</text>
  <text x="181" y="464" text-anchor="middle" fill="#46585F" font-size="9.5">body_module_magic! ABI 校验</text>

  <rect x="304" y="396" width="214" height="78" rx="4" fill="#F7F6F2" stroke="#245A6B" stroke-width="0.9"/>
  <text x="411" y="416" text-anchor="middle" fill="#245A6B" font-size="11" font-weight="700">kernel/body-kernel</text>
  <text x="411" y="434" text-anchor="middle" fill="#46585F" font-size="9.5">8 张 body_cat_* 系统目录</text>
  <text x="411" y="449" text-anchor="middle" fill="#46585F" font-size="9.5">SQLite Core AM / 锁 / RRF / 胶囊</text>
  <text x="411" y="464" text-anchor="middle" fill="#46585F" font-size="9.5">协议外壳 + 轨 B IPC 代理</text>

  <!-- 右上：contrib/<ext>/ 标准五件套解剖 -->
  <rect x="574" y="92" width="550" height="196" rx="6" fill="#EBF5F0" stroke="#2F7A66" stroke-width="1.2"/>
  <text x="592" y="115" fill="#2F7A6B" font-size="13.5" font-weight="700">2. 单个 contrib/&lt;ext_name&gt;/ 标准扩展包解剖（类 PG Extension）</text>

  <rect x="592" y="130" width="250" height="44" rx="4" fill="#F7F6F2" stroke="#2F7A66" stroke-width="0.9"/>
  <text x="604" y="148" fill="#2F7A66" font-size="11" font-weight="700">① &lt;ext&gt;.control.toml</text>
  <text x="604" y="164" fill="#46585F" font-size="9.5">声明 id / version / requires / abi / 沙盒策略</text>

  <rect x="856" y="130" width="250" height="44" rx="4" fill="#F7F6F2" stroke="#2F7A66" stroke-width="0.9"/>
  <text x="868" y="148" fill="#2F7A66" font-size="11" font-weight="700">② sql/&lt;ext&gt;--0.1.0.sql</text>
  <text x="868" y="164" fill="#46585F" font-size="9.5">私有表 DDL (强制 ext_&lt;name&gt;__* 前缀隔离)</text>

  <rect x="592" y="184" width="250" height="44" rx="4" fill="#F7F6F2" stroke="#2F7A6B" stroke-width="0.9"/>
  <text x="604" y="202" fill="#2F7A66" font-size="11" font-weight="700">③ src/lib.rs + body_module_magic!</text>
  <text x="604" y="218" fill="#46585F" font-size="9.5">实现 BodyExtension 并向 Catalog 注册 Routine</text>

  <rect x="856" y="184" width="250" height="44" rx="4" fill="#F7F6F2" stroke="#2F7A66" stroke-width="0.9"/>
  <text x="868" y="202" fill="#2F7A66" font-size="11" font-weight="700">④ Cargo.toml + ⑤ tests/regress.rs</text>
  <text x="868" y="218" fill="#46585F" font-size="9.5">仅依赖 body-sdk；类 pg_regress 独立回归测试</text>

  <rect x="592" y="238" width="514" height="36" rx="4" fill="#F7F6F2" stroke="#D9D5CB" stroke-width="1"/>
  <text x="849" y="260" text-anchor="middle" fill="#1B2B33" font-size="10.5" font-weight="600">内核门禁：arch_boundary_check.py 强制校验「无跨 ext 越权 SQL、无反向依赖、5 件套完备」</text>

  <!-- 右下：严格四阶段演进时序 -->
  <rect x="574" y="302" width="550" height="206" rx="6" fill="#F1EFE9" stroke="#BE653B" stroke-width="1.2"/>
  <text x="592" y="325" fill="#BE653B" font-size="13.5" font-weight="700">3. 严格演进时序红线：先纯化内核 → 再剥离存量 → 最后用 contrib 填 GAP</text>

  <rect x="592" y="340" width="246" height="68" rx="4" fill="#E5EFF0" stroke="#245A6B" stroke-width="1"/>
  <text x="604" y="359" fill="#245A6B" font-size="11" font-weight="700">Phase K1 · 纯微内核与 Hook 骨架</text>
  <text x="604" y="376" fill="#1B2B33" font-size="9.5">切出 body-sdk + 8 张目录表 + 7 Hook 插槽</text>
  <text x="604" y="392" fill="#BE653B" font-size="9.5" font-weight="700">红线：0 业务/运维新 GAP 混入内核</text>

  <line x1="838" y1="374" x2="858" y2="374" stroke="#245A6B" stroke-width="1.4" marker-end="url(#arrK1)"/>

  <rect x="862" y="340" width="246" height="68" rx="4" fill="#E5EFF0" stroke="#245A6B" stroke-width="1"/>
  <text x="874" y="359" fill="#245A6B" font-size="11" font-weight="700">Phase K2 · 瘦身 SPI 与四端派生</text>
  <text x="874" y="376" fill="#1B2B33" font-size="9.5">TableAmRoutine + body_cat_proc 自动派生</text>
  <text x="874" y="392" fill="#1B2B33" font-size="9.5">打通轨 B 进程外 JSON-RPC 沙盒代理</text>

  <line x1="985" y1="408" x2="985" y2="424" stroke="#2F7A66" stroke-width="1.4" marker-end="url(#arrK3)"/>

  <rect x="862" y="428" width="246" height="68" rx="4" fill="#EBF5F0" stroke="#2F7A66" stroke-width="1"/>
  <text x="874" y="447" fill="#2F7A66" font-size="11" font-weight="700">Phase K3 · 存量周边迁入 contrib/</text>
  <text x="874" y="464" fill="#1B2B33" font-size="9.5">14 个存量周边模块迁出内核进 contrib/</text>
  <text x="874" y="480" fill="#1B2B33" font-size="9.5">守护 kernel-minimal 独立通过 &amp; v1.1 兼容</text>

  <line x1="862" y1="462" x2="842" y2="462" stroke="#BE653B" stroke-width="1.4" marker-end="url(#arrK2)"/>

  <rect x="592" y="428" width="246" height="68" rx="4" fill="#F7E9DE" stroke="#BE653B" stroke-width="1.2"/>
  <text x="604" y="447" fill="#BE653B" font-size="11" font-weight="700">Phase K4 · contrib/ 实现新 GAP</text>
  <text x="604" y="464" fill="#1B2B33" font-size="9.5">新增 probe_linux_ops / jvm / mtls / siem</text>
  <text x="604" y="480" fill="#1B2B33" font-size="9.5">组装 aiops-probe 发行版（内核 0 改动）</text>
</svg>
