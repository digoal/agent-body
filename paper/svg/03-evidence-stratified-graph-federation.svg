  <text x="702" y="216" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">跨介质拓扑: Cron -&gt; Python/Rust 脚本</text>
  <text x="702" y="236" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">-&gt; 监听端口 :8765 -&gt; Systemd 守护单元</text>
  <text x="702" y="256" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">微基准 M1: 100节点 3跳遍历 P50 = 244 us</text>
