  <path d="M 825,312 L 825,328" fill="none" stroke="#B56917" stroke-width="1.8" marker-end="url(#arr-amber)"/>
  <path d="M 825,434 L 825,450" fill="none" stroke="#5A418E" stroke-width="1.8" marker-end="url(#arr-purple)"/>
  <text x="28" y="602" font-size="11" font-weight="400" fill="#6B7F88" text-anchor="start">数据与源码出处: src/brief/optimistic.rs · src/hooks/diagnoser.rs · src/audit/evolution.rs · Benchmark W15 &amp; PR-11</text>
</svg>
