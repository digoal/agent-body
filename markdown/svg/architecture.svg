<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
  </defs>
  <rect width="840" height="420" rx="10" fill="url(#bgGrad)" stroke="#1e293b"/>

  <!-- Layer 1 -->
  <rect x="20" y="15" width="800" height="65" rx="6" fill="#0b1b33" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="35" y="38" fill="#38bdf8" font-size="12" font-weight="bold">Layer 1: 接入与交互通道 (Interface &amp; Access Layer)</text>
  <text x="35" y="55" fill="#94a3b8" font-size="8.5">零门槛无缝嵌入现有 Agent 生态 · 标准协议即插即用</text>

  <rect x="360" y="24" width="135" height="45" rx="4" fill="#0f2647" stroke="#0284c7"/>
  <text x="427" y="44" fill="#e0f2fe" font-size="9" font-weight="bold" text-anchor="middle">🔌 MCP stdio 服务</text>
  <text x="427" y="58" fill="#7dd3fc" font-size="7.5" text-anchor="middle">18 个原生工具 JSON-RPC</text>

  <rect x="510" y="24" width="135" height="45" rx="4" fill="#0f2647" stroke="#0284c7"/>
  <text x="577" y="44" fill="#e0f2fe" font-size="9" font-weight="bold" text-anchor="middle">💻 CLI 命令行工具</text>
  <text x="577" y="58" fill="#7dd3fc" font-size="7.5" text-anchor="middle">status/brief/place/audit</text>

  <rect x="660" y="24" width="145" height="45" rx="4" fill="#0f2647" stroke="#0284c7"/>
  <text x="732" y="44" fill="#e0f2fe" font-size="9" font-weight="bold" text-anchor="middle">⚙️ 常驻守护服务</text>
  <text x="732" y="58" fill="#7dd3fc" font-size="7.5" text-anchor="middle">Systemd + inotify + 60s 轮询</text>

  <!-- Layer 2 -->
  <rect x="20" y="95" width="800" height="135" rx="6" fill="#131433" stroke="#818cf8" stroke-width="1.2"/>
  <text x="35" y="118" fill="#a78bfa" font-size="12" font-weight="bold">Layer 2: 核心治理与认知引擎 (Core Stewardship Engines)</text>
  <text x="35" y="133" fill="#94a3b8" font-size="8.5">Rust 纯原生闭环实现 · 毫秒级无锁算法 · 杜绝一切宿主混乱</text>

  <rect x="35" y="145" width="120" height="75" rx="5" fill="#1e1b4b" stroke="#818cf8"/>
  <text x="95" y="166" fill="#c7d2fe" font-size="9" font-weight="bold" text-anchor="middle">🎯 放置建议引擎</text>
  <text x="95" y="184" fill="#94a3b8" font-size="7.5" text-anchor="middle">8 大标准规范目录</text>
  <text x="95" y="200" fill="#818cf8" font-size="7.5" font-weight="bold" text-anchor="middle">规范命名 / 防散落</text>

  <rect x="165" y="145" width="120" height="75" rx="5" fill="#1e1b4b" stroke="#818cf8"/>
  <text x="225" y="166" fill="#c7d2fe" font-size="9" font-weight="bold" text-anchor="middle">🛡️ 分级扫描引擎</text>
  <text x="225" y="184" fill="#94a3b8" font-size="7.5" text-anchor="middle">白名单深挖到底</text>
  <text x="225" y="200" fill="#34d399" font-size="7.5" font-weight="bold" text-anchor="middle">黑名单 Depth=0 阻断</text>

  <rect x="295" y="145" width="120" height="75" rx="5" fill="#1e1b4b" stroke="#818cf8"/>
  <text x="355" y="166" fill="#c7d2fe" font-size="9" font-weight="bold" text-anchor="middle">⚡ 端口防撞感知</text>
  <text x="355" y="184" fill="#94a3b8" font-size="7.5" text-anchor="middle">/proc/net/tcp 解析</text>
  <text x="355" y="200" fill="#38bdf8" font-size="7.5" font-weight="bold" text-anchor="middle">空闲端口智能推荐</text>

  <rect x="425" y="145" width="120" height="75" rx="5" fill="#1e1b4b" stroke="#818cf8"/>
  <text x="485" y="166" fill="#c7d2fe" font-size="9" font-weight="bold" text-anchor="middle">🔍 混合 RRF 检索</text>
  <text x="485" y="184" fill="#94a3b8" font-size="7.5" text-anchor="middle">FTS5 全文 + Ollama</text>
  <text x="485" y="200" fill="#fbbf24" font-size="7.5" font-weight="bold" text-anchor="middle">倒数排名无缝融合</text>

  <rect x="555" y="145" width="120" height="75" rx="5" fill="#1e1b4b" stroke="#818cf8"/>
  <text x="615" y="166" fill="#c7d2fe" font-size="9" font-weight="bold" text-anchor="middle">💥 爆炸半径 &amp; 联邦</text>
  <text x="615" y="184" fill="#94a3b8" font-size="7.5" text-anchor="middle">BFS 逆向依赖推演</text>
  <text x="615" y="200" fill="#f43f5e" font-size="7.5" font-weight="bold" text-anchor="middle">CodeGraph 微观下钻</text>

  <rect x="685" y="145" width="120" height="75" rx="5" fill="#1e1b4b" stroke="#818cf8"/>
  <text x="745" y="166" fill="#c7d2fe" font-size="9" font-weight="bold" text-anchor="middle">🧹 会话生命周期</text>
  <text x="745" y="184" fill="#94a3b8" font-size="7.5" text-anchor="middle">/tmp 垃圾自动回收</text>
  <text x="745" y="200" fill="#10b981" font-size="7.5" font-weight="bold" text-anchor="middle">完工结算不留碎片</text>

  <!-- Layer 3 -->
  <rect x="20" y="245" width="800" height="95" rx="6" fill="#062e24" stroke="#10b981" stroke-width="1.2"/>
  <text x="35" y="268" fill="#34d399" font-size="12" font-weight="bold">Layer 3: 存储持久化与索引层 (~/.steward/steward.db)</text>
  <text x="35" y="283" fill="#94a3b8" font-size="8.5">单文件 SQLite WAL 模式 · 静态 Bundled FTS5 全文引擎 · 零系统动态库依赖</text>

  <rect x="35" y="295" width="145" height="34" rx="4" fill="#04231b" stroke="#059669"/>
  <text x="107" y="312" fill="#a7f3d0" font-size="8.5" font-weight="bold" text-anchor="middle">memories &amp; assets 表</text>
  <text x="107" y="323" fill="#6ee7b7" font-size="7" text-anchor="middle">元数据 + embedding 向量</text>

  <rect x="190" y="295" width="145" height="34" rx="4" fill="#04231b" stroke="#059669"/>
  <text x="262" y="312" fill="#a7f3d0" font-size="8.5" font-weight="bold" text-anchor="middle">FTS5 全文虚拟表</text>
  <text x="262" y="323" fill="#6ee7b7" font-size="7" text-anchor="middle">memories_fts / assets_fts</text>

  <rect x="345" y="295" width="145" height="34" rx="4" fill="#04231b" stroke="#059669"/>
  <text x="417" y="312" fill="#a7f3d0" font-size="8.5" font-weight="bold" text-anchor="middle">links 拓扑依赖表</text>
  <text x="417" y="323" fill="#6ee7b7" font-size="7" text-anchor="middle">行号 + 代码切片 + 出处</text>

  <rect x="500" y="295" width="145" height="34" rx="4" fill="#04231b" stroke="#059669"/>
  <text x="572" y="312" fill="#a7f3d0" font-size="8.5" font-weight="bold" text-anchor="middle">active_procs 表</text>
  <text x="572" y="323" fill="#6ee7b7" font-size="7" text-anchor="middle">PID / 端口 / 进程命令行</text>

  <rect x="655" y="295" width="150" height="34" rx="4" fill="#04231b" stroke="#059669"/>
  <text x="730" y="312" fill="#a7f3d0" font-size="8.5" font-weight="bold" text-anchor="middle">changes 审计流水</text>
  <text x="730" y="323" fill="#6ee7b7" font-size="7" text-anchor="middle">会话变动 diff 记录</text>

  <!-- Layer 4 -->
  <rect x="20" y="352" width="800" height="52" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.2"/>
  <text x="35" y="373" fill="#94a3b8" font-size="10.5" font-weight="bold">Layer 4: 宿主系统内核与文件系统 (Linux OS Kernel &amp; Subsystems)</text>
  <text x="35" y="390" fill="#64748b" font-size="8">内核虚拟文件系统 /proc/net/tcp · /proc/[pid]/fd · Linux inotify FS 事件 · 宿主机规范物理存储 /root/new/*</text>
</svg>
