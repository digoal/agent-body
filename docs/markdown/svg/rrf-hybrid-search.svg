<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="220" rx="8" fill="url(#bgGrad5)" stroke="#1e293b"/>
  <text x="400" y="30" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">🔍 海马体 RRF 混合检索、写穿保鲜与跨大脑接力胶囊</text>

  <!-- Query input -->
  <rect x="25" y="75" width="130" height="60" rx="6" fill="#0f2647" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="90" y="98" fill="#e0f2fe" font-size="9" font-weight="bold" text-anchor="middle">换脑 / 口语查询</text>
  <text x="90" y="116" fill="#38bdf8" font-size="9" font-weight="bold" text-anchor="middle">“防雪崩预案”</text>

  <path d="M 155 95 L 205 65" stroke="#f43f5e" stroke-width="1.8"/>
  <path d="M 155 120 L 205 150" stroke="#818cf8" stroke-width="1.8"/>

  <!-- Channel A -->
  <rect x="205" y="45" width="220" height="42" rx="4" fill="#2d0b16" stroke="#f43f5e"/>
  <text x="315" y="62" fill="#fecaca" font-size="8.5" font-weight="bold" text-anchor="middle">渠道 A: SQLite FTS5 / PG tsvector</text>
  <text x="315" y="77" fill="#fca5a5" font-size="7.5" text-anchor="middle">严格仅召回 status='active' · 写穿防陈旧</text>

  <!-- Channel B -->
  <rect x="205" y="130" width="220" height="42" rx="4" fill="#1e1b4b" stroke="#818cf8"/>
  <text x="315" y="147" fill="#e0e7ff" font-size="8.5" font-weight="bold" text-anchor="middle">渠道 B: Ollama nomic-embed 768 维向量</text>
  <text x="315" y="162" fill="#c7d2fe" font-size="7.5" text-anchor="middle">语义相似度高分唤醒历史决策记忆</text>

  <!-- Merge to RRF -->
  <path d="M 425 65 L 475 95" stroke="#10b981" stroke-width="2"/>
  <path d="M 425 150 L 475 120" stroke="#10b981" stroke-width="2"/>

  <rect x="475" y="65" width="160" height="85" rx="6" fill="#062e24" stroke="#10b981" stroke-width="1.5"/>
  <text x="555" y="86" fill="#d1fae5" font-size="9" font-weight="bold" text-anchor="middle">RRF 融合 + 新鲜度门禁</text>
  <text x="555" y="103" fill="#34d399" font-size="8" font-weight="bold" text-anchor="middle">1/(60+r₁) + 1/(60+r₂)</text>
  <text x="555" y="122" fill="#a7f3d0" font-size="7.5" text-anchor="middle">改删写穿失效 · 半衰期加权</text>
  <text x="555" y="138" fill="#94a3b8" font-size="7" text-anchor="middle">模型离线时平滑回退 FTS</text>

  <path d="M 635 107 L 670 107" stroke="#10b981" stroke-width="2"/>

  <!-- Output -->
  <rect x="670" y="65" width="115" height="85" rx="6" fill="#04231b" stroke="#059669"/>
  <text x="727" y="88" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">🧬 1ms 无损接力</text>
  <text x="727" y="106" fill="#34d399" font-size="8" font-weight="bold" text-anchor="middle">Rank #1 记忆</text>
  <text x="727" y="122" fill="#a7f3d0" font-size="7.5" text-anchor="middle">+ &lt;=300 tok 胶囊</text>
  <text x="727" y="138" fill="#6ee7b7" font-size="7" text-anchor="middle">W17 省 92.7% Tok</text>

  <rect x="25" y="180" width="760" height="28" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="405" y="198" fill="#cbd5e1" font-size="8" text-anchor="middle">💡 无论是从 Claude 切换到 Codex 还是新开会话，海马体与 body_checkpoints 确保跨大脑工作记忆不断档。</text>
</svg>
