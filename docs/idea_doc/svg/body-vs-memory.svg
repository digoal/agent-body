<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <filter id="s2"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.10"/></filter>
  </defs>

  <!-- 标题 -->
  <text x="360" y="30" text-anchor="middle" fill="#1e293b" font-size="16" font-weight="700">从「记忆管理」到「Agent 本体」—— 需求全景对比</text>

  <!-- 左半: 现有方案 -->
  <rect x="20" y="50" width="320" height="330" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" filter="url(#s2)"/>
  <text x="180" y="78" text-anchor="middle" fill="#991b1b" font-size="14" font-weight="700">现有 Agent Memory 项目</text>
  <text x="180" y="96" text-anchor="middle" fill="#b91c1c" font-size="11">只做了 ⅓</text>

  <rect x="40" y="112" width="280" height="36" rx="6" fill="#fee2e2"/>
  <text x="180" y="135" text-anchor="middle" fill="#7f1d1d" font-size="12">✅ 对话记忆 / 向量检索 / 摘要</text>

  <rect x="40" y="158" width="280" height="36" rx="6" fill="#fef9c3"/>
  <text x="180" y="181" text-anchor="middle" fill="#713f12" font-size="12">⚠️ 知识图谱（质量不可控）</text>

  <rect x="40" y="204" width="280" height="36" rx="6" fill="#f1f5f9"/>
  <text x="180" y="227" text-anchor="middle" fill="#94a3b8" font-size="12">❌ 不知道机器上装了什么</text>

  <rect x="40" y="250" width="280" height="36" rx="6" fill="#f1f5f9"/>
  <text x="180" y="273" text-anchor="middle" fill="#94a3b8" font-size="12">❌ 不知道项目和素材在哪</text>

  <rect x="40" y="296" width="280" height="36" rx="6" fill="#f1f5f9"/>
  <text x="180" y="319" text-anchor="middle" fill="#94a3b8" font-size="12">❌ 不知道环境有什么变化</text>

  <rect x="40" y="342" width="280" height="28" rx="6" fill="#f1f5f9"/>
  <text x="180" y="361" text-anchor="middle" fill="#94a3b8" font-size="12">❌ 四维信息之间无关联</text>

  <!-- 右半: agent-body -->
  <rect x="380" y="50" width="320" height="330" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1" filter="url(#s2)"/>
  <text x="540" y="78" text-anchor="middle" fill="#166534" font-size="14" font-weight="700">agent-body Agent 本体</text>
  <text x="540" y="96" text-anchor="middle" fill="#15803d" font-size="11">记忆 × 资产 × 环境 × 变更 × 关联</text>

  <rect x="400" y="112" width="280" height="36" rx="6" fill="#dcfce7"/>
  <text x="540" y="135" text-anchor="middle" fill="#166534" font-size="12">✅ 记忆（衰减/强化/分类/混合搜索）</text>

  <rect x="400" y="158" width="280" height="36" rx="6" fill="#dcfce7"/>
  <text x="540" y="181" text-anchor="middle" fill="#166534" font-size="12">✅ 资产索引（项目/脚本/素材/标签）</text>

  <rect x="400" y="204" width="280" height="36" rx="6" fill="#dcfce7"/>
  <text x="540" y="227" text-anchor="middle" fill="#166534" font-size="12">✅ 环境感知（服务/软件/端口/快照）</text>

  <rect x="400" y="250" width="280" height="36" rx="6" fill="#dcfce7"/>
  <text x="540" y="273" text-anchor="middle" fill="#166534" font-size="12">✅ 变更追踪（文件/服务/环境 diff）</text>

  <rect x="400" y="296" width="280" height="36" rx="6" fill="#dcfce7"/>
  <text x="540" y="319" text-anchor="middle" fill="#166534" font-size="12">✅ 智能关联（四维交叉检索）</text>

  <rect x="400" y="342" width="280" height="28" rx="6" fill="#bbf7d0"/>
  <text x="540" y="361" text-anchor="middle" fill="#166534" font-size="12" font-weight="600">= agent-body brief（一次调用全拿到）</text>
</svg>
