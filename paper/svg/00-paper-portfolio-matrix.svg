  <text x="42" y="47" font-size="18" font-weight="700" fill="#162A33" text-anchor="start">Agent Body 顶会论文矩阵全景图 (1 旗舰奠基篇 + 4 正交学科专论 = 共 5 篇)</text>
  <text x="42" y="68" font-size="12" font-weight="400" fill="#425863" text-anchor="start">遵循 One Paper, One Sharp Thesis 学术准则：拒绝大杂烩工程报告，以单一系统底座支撑五大 CCF-A 顶级会议赛道</text>
