# ==============================================================================
# Agent Host Steward (宿主环境大管家) — 配置文件参考模板
# ==============================================================================
#
# 配置文件默认查找路径:
#   1. 环境变量: STEWARD_CONFIG (最高优先级)
#   2. 命令行参数: agent-steward --config <path> ...
#   3. 用户家目录: ~/.steward/config.toml (默认路径)
#
# 首次运行任何 steward 命令时，若上述路径均不存在配置文件，
# 系统将自动根据本模板创建默认的 ~/.steward/config.toml。
# ==============================================================================

# 基础数据存储目录 (SQLite 数据库、本地缓存、备份文件均存放于此)
# 依赖: 该目录必须具备当前运行用户的读写权限，且磁盘剩余空间建议 >= 100MB
# 默认: "/root/.steward" (或 "$HOME/.steward")
data_dir = "/root/.steward"

# SQLite 主存储数据库文件绝对路径
# 默认: "{data_dir}/steward.db"
db_path = "/root/.steward/steward.db"

# HTTP API 监听端口 (仅当启动独立的 HTTP/Web 服务模式时生效，stdio MCP 模式不占用端口)
# 取值范围: 1024 ~ 65535 (禁止使用低于 1024 的特权端口)
# 默认: 9527
api_port = 9527

# HTTP API 绑定网络地址
# 安全建议: 生产与单机环境保持 "127.0.0.1"；若多机 Agent 访问请配置内网 IP
# 默认: "127.0.0.1"
api_bind = "127.0.0.1"

# ==============================================================================
# [storage] 多存储引擎与后端配置
# ==============================================================================
[storage]
# 主存储后端选择
# 可选值:
#   - "sqlite": 嵌入式单文件数据库 (默认，零外部依赖，内置 FTS5 全文索引，极速单机)
#   - "postgres": 外部高并发关系数据库 (需安装 PostgreSQL >= 14 并启用 pgvector 扩展)
#   - "duckdb": 嵌入式列存分析库 (用于大批量日志/变更时序离线分析)
# 默认: "sqlite"
provider = "sqlite"

# PostgreSQL 连接串 (仅当 provider = "postgres" 时必须配置)
# 格式示例: "host=127.0.0.1 port=5432 user=steward password=secret dbname=steward"
# 依赖要求: 
#   1. PostgreSQL 服务处于监听状态
#   2. 数据库已执行 CREATE EXTENSION IF NOT EXISTS vector;
#   3. DDL 迁移可通过 `agent-steward storage migrate --to postgres` 自动导入
# pg_url = "host=localhost port=5432 user=steward dbname=steward"

# DuckDB 数据库文件路径 (若不填则默认为 {data_dir}/steward.duckdb)
# duckdb_path = "/root/.steward/steward.duckdb"

# ==============================================================================
# [embedding] 长期记忆语义向量嵌入服务配置 (可选)
# ==============================================================================
[embedding]
# 本地或内网 Ollama 嵌入服务地址
# 依赖要求: 本机或内网需安装 Ollama (https://ollama.com) 并已启动服务
# 默认: "http://localhost:11434"
ollama_url = "http://localhost:11434"

# 文本向量化嵌入模型名称
# 推荐模型:
#   - "nomic-embed-text": 768 维，极速且显存开销小 (pull: `ollama pull nomic-embed-text`)
#   - "bge-m3:latest": 1024 维，高质量中文与代码双语混合嵌入 (pull: `ollama pull bge-m3`)
# 默认: "nomic-embed-text"
model = "nomic-embed-text"

# 向量维度 (必须与所选模型的实际输出维度完全一致)
#   - nomic-embed-text 为 768
#   - bge-m3 为 1024
# 默认: 768
dimensions = 768

# 当 Ollama 服务离线或连接失败时，是否自动降级为 SQLite FTS5 纯全文检索
# 建议: true (确保系统在断网或 Ollama 挂掉时依然能检索记忆，绝不崩溃)
# 默认: true
fallback_fts_only = true

# ==============================================================================
# [assets] 资产分级扫描与监听配置
# ==============================================================================
[assets]
# 后台常驻守护进程 (daemon) 启动时自动递归扫描与监听的核心目录列表
# 建议: 仅配置日常存放代码、脚本、资料的工作目录；切勿配置根目录 "/" 或超大目录
# 默认: 空数组 (启动时自动查找并纳管 ~/new/work 与 ~/new/shared_proj)
auto_scan_dirs = [
    # "/root/new/work",
    # "/root/new/shared_proj"
]

# 扫描与监听时全局忽略的文件与目录模式 (Glob 表达式)
# 白名单优先深挖到底，命中以下模式的目录将严格止于当前层级，绝不下钻
ignore_patterns = [
    ".git",
    "node_modules",
    "__pycache__",
    ".steward",
    "target",
    ".venv",
    ".idea",
    ".vscode",
    "dist",
    "build"
]

# ==============================================================================
# [placement] 新对象放置建议与命名规范配置
# ==============================================================================
[placement]
# 默认新建资产的属主标识
# 默认: "user:digoal"
default_owner = "user:digoal"

# 默认安全分级
# 可选值: "public" | "internal" | "confidential" | "secret"
# 默认: "internal"
default_security_level = "internal"

# ─────────────────────────────────────────────────────────────────────────────
# 6. Web UI 与可视化监控大屏配置 (Web Dashboard)
# ─────────────────────────────────────────────────────────────────────────────
[web]
# 是否随 daemon 守护进程自动拉起 Web 监控大屏
# 取值: true / false
# 默认: true
enabled = true

# HTTP 服务监听地址
# 取值: "127.0.0.1" (仅限本机，推荐安全默认值) 或 "0.0.0.0" (允许局域网/跨主机访问看板)
# 默认: "127.0.0.1"
host = "127.0.0.1"

# HTTP 服务监听端口
# 取值: 1024 ~ 65535
# 默认: 8765
port = 8765

# 管理员受控运维操作鉴权 Token (可选)
# 若留空，则 Web 看板为只读监控模式；配置后，POST /api/v1/locks/release 需携带该 Bearer Token
# auth_token = "steward-admin-secret"

# ==============================================================================
# 7. HOOK 事件总线与外部扩展规则 (Hooks Engine - Phase 14)
# ==============================================================================
# 支持事件类型:
#   - on_file_created / on_file_modified / on_file_deleted
#   - on_asset_registered
#   - on_memory_added / on_memory_updated
#   - on_service_status_changed / on_port_changed
#   - on_lock_acquired / on_lock_released
#   - on_session_started / on_session_closed
#
# 动作 action:
#   - exec: 执行本地命令或脚本 ({path}, {event} 占位符支持)
#   - webhook: 向指定 URL 投递 HTTP POST JSON
# 默认值: [] (不配置 [[hooks]] 即为空规则集)
#
# 示例 1: 当在核心工作区创建 Markdown 文件时，自动执行本地扫描
# [[hooks]]
# event = "on_file_created"
# filter = { path_prefix = "/root/new/work", extensions = [".md"] }
# action = "exec"
# command = "agent-steward asset scan {path} --depth 1"
#
# 示例 2: 长期记忆写入时，向外部通知中枢发送 Webhook (3秒超时)
# [[hooks]]
# event = "on_memory_added"
# filter = { tags_contain = ["decision", "architecture"] }
# action = "webhook"
# url = "http://127.0.0.1:8765/api/v1/notify"
# timeout_ms = 3000

# ==============================================================================
# 8. HOOK Pipeline 链式编排引擎 (Phase 14.6)
# ==============================================================================
# 支持多步骤串联、条件过滤、防抖幂等与失败策略 (abort / continue)
# [[pipelines]]
# id = "pipe-docs-sync"
# name = "文档自动化建链编排"
# event_pattern = "on_file_created"
# debounce_ms = 500
# [[pipelines.steps]]
# name = "step-scan-asset"
# action = { action = "exec", command = "agent-steward asset scan {path} --depth 1" }
# filter = { path_prefix = "/root/new/work", extensions = [".md"] }
# on_failure = "abort"
# timeout_ms = 3000
# [[pipelines.steps]]
# name = "step-notify-webhook"
# action = { action = "webhook", url = "http://127.0.0.1:8765/api/v1/notify", timeout_ms = 3000 }
# on_failure = "continue"

# ==============================================================================
# 9. 生态目录 (MCP / SKILL / 外部服务通讯录) 与 Context 防爆路由 (Phase 16)
# ==============================================================================
# 默认扫描路径:
#   - MCP 配置: ~/.hermes/config.yaml, ~/.gemini/antigravity-cli/mcp_config.json,
#               ~/.config/claude/claude_desktop_config.json, ~/.cursor/mcp.json
#   - SKILL 目录: /root/new/skills, ~/.gemini/antigravity-cli/skills,
#                 ~/.gemini/antigravity-cli/builtin/skills
# 安全约束:
#   - 扫描 MCP 配置时强制剥离 env 明文密钥，仅保留变量名；
#   - external_services 严禁存储任何明文 API Key/Token/Password。

# ==============================================================================
# 10. 轻量多机联邦 Peer Mesh 配置 (Phase 18)
# ==============================================================================
[mesh]
# 是否启用联邦客户端能力（服务端 /api/v1/mesh/* 随 [web] 服务自动暴露）
# 默认: false
enabled = false
# 对等节点 Web 基地址列表（当 enabled = true 且 peers 非空时，各节点必须配置相同的 [web].auth_token 作为共享密钥）
# 示例: peers = ["http://192.168.31.161:8756"]
peers = []
# 单次对等请求超时（毫秒）
# 默认: 1500
timeout_ms = 1500

# ==============================================================================
# 11. 资产语义元数据 Ollama 自动标注配置 (Phase 23 - ISSUE #8)
# ==============================================================================
[annotation]
# 是否启用本地 Ollama 小模型语义标注精炼（关闭或离线时自动降级为 L1 确定性提取）
enabled = true
# 本地 Ollama 服务地址
ollama_url = "http://localhost:11434"
# 推荐轻量模型: qwen3.5:0.8b (CPU 单核/多核实测 ~3s/文件, 零云端 Token)
model = "qwen3.5:0.8b"
# 单文件推理超时（毫秒）
timeout_ms = 15000
# 送入小模型的文件头部摘录字符上限（自动经过 SecretRedactor 脱敏）
max_snippet_chars = 1200
# 守护进程每次巡检自动异步精炼的资产批量上限
auto_enrich_batch_size = 10




