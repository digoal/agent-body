  <text x="310" y="338" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">命题: 端侧弱向量补偿与宏微联邦</text>
  <text x="310" y="362" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">矛盾: 0.8B 弱向量塌缩与假硬边</text>
  <text x="310" y="386" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">机制 1: L1/L2/L3 证据分层图谱</text>
  <text x="310" y="410" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">机制 2: 对数饱和上卷 + Top-3 剪枝</text>
  <text x="310" y="434" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">机制 3: 0.8B 原文锚定三元组抽取</text>
  <text x="310" y="458" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">机制 4: 8 维重归一化 Omni-RRF</text>
  <text x="310" y="482" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">连通率: 孤立率 99.5% -&gt; 0.5%</text>
  <text x="310" y="506" font-size="11" font-weight="400" fill="#162A33" text-anchor="start">离线检索: 0 向量 &lt;20ms 100% 召回</text>
