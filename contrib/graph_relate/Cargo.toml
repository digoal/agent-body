[package]
name = "ext-graph-relate"
version = "0.1.0"
edition = "2021"
authors = ["digoal 德哥"]
description = "Agent Body Contrib Extension — Embedded openCypher Graph Engine via librelate_ffi v2"
license = "Apache-2.0"

[dependencies]
agent-body-sdk = { path = "../../kernel/body-sdk" }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
agent-body-kernel = { path = "../../kernel/body-kernel" }
tempfile = "3.10"
